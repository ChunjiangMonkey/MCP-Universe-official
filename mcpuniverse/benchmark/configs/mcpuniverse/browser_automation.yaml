kind: llm
spec:
  name: llm-1
  type: openai
  config:
    model_name: qwen_v8

---
kind: agent
spec:
  name: function-call-agent
  type: function-call
  config:
    llm: llm-1
    instruction: You are an agent for Browser automation.
    max_iterations: 50
    summarize_tool_response: false
    use_custom_tools: true


